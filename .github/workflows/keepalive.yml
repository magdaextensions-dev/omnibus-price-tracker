name: Podtrzymanie aktywności repozytorium

# Raz w miesiącu zapisuje w repozytorium drobną zmianę (datę),
# żeby GitHub nie uznał repo za nieaktywne i nie wyłączył harmonogramów (limit 60 dni).
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Zapisz datę ostatniego podtrzymania
        run: date -u +"%Y-%m-%d %H:%M UTC" > .github/keepalive.txt

      - name: Zatwierdź zmianę
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Podtrzymanie aktywności repozytorium (automat)"
          git push
