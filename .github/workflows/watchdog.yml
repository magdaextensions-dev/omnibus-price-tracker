name: Strażnik harmonogramów

# Codziennie sprawdza, czy oba główne workflowy są włączone i faktycznie się uruchamiają.
# Jeśli nie - próbuje je włączyć i kończy się błędem, a GitHub wysyła e-mail z alarmem.
on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdź workflowy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          problem=0
          check() {
            file="$1"; max_hours="$2"
            state=$(gh api "repos/$REPO/actions/workflows/$file" --jq .state)
            last=$(gh api "repos/$REPO/actions/workflows/$file/runs?per_page=1" --jq '.workflow_runs[0].created_at // empty')
            echo "$file: stan=$state, ostatnie uruchomienie=${last:-brak}"
            if [ "$state" != "active" ]; then
              echo "::error::Workflow $file jest WYŁĄCZONY ($state). Próbuję włączyć ponownie."
              gh workflow enable "$file" --repo "$REPO" || true
              problem=1
            fi
            if [ -z "$last" ]; then
              echo "::error::Workflow $file nie ma żadnego uruchomienia."
              problem=1
            else
              age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 3600 ))
              if [ "$age" -gt "$max_hours" ]; then
                echo "::error::Workflow $file nie uruchomił się od $age godz. (limit: $max_hours godz.)."
                problem=1
              fi
            fi
          }
          check price-campaigns.yml 6
          check update-price-history.yml 36
          exit $problem
